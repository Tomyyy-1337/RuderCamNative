[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
shared_data = { path = "../shared_data", features = ["backend"] }
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio-serial = { version = "5.5.0" }
async-stream = { version = "0.3.6" }
lazy_static = { version = "1.5.1" }
reqwest = { version = "0.13.5", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = "0.5.0" 
gpiocdev = "0.8.0"
libc = "0.2.191"