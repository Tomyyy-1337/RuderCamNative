[package]
name = "shared_data"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", optional = true }
nsh-core = { version = "0.6.0", optional = true }
serde_json = { version = "1.0", optional = true }
axum = { version = "0.8.9", optional = true, features = ["ws"] }

[features]
backend = [
    "dep:axum"
]
frontend = [
    "dep:chrono",
    "dep:nsh-core",
    "dep:serde_json"
]