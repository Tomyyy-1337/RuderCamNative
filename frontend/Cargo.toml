[package]
name = "nsh-app-frontend"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.6.1"
nsh-base = "0.6.1"
env_logger = "0.11"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_data = { path = "../shared_data", features = ["frontend"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.1", default-features = false, features = ["editor", "highlight", "math", "plot", "term", "webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["editor", "highlight", "math", "plot", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false, features = ["editor", "highlight", "math", "plot", "term", "webview"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = "0.30.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent"] }


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
