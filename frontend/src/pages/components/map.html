<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <meta name="color-scheme" content="__THEME__">
        <style>html, body { background: __BACKGROUND__; }</style>
        <style>__MAPLIBRE_CSS__</style>
        <script type="text/plain" id="maplibre-src">__MAPLIBRE_JS__</script>
        <script type="text/plain" id="maplibre-worker-src">__MAPLIBRE_WORKER__</script>
        <script>__PMTILES_JS__</script>
        <script>__MAP_STYLE__</script>
        <style>
            html, body, #map {
                margin: 0;
                height: 100%;
                width: 100%;
                overflow: hidden;
            }
            #loading {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: __BACKGROUND__;
                color: #555;
                font: 16px sans-serif;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <div id="loading"></div>
        <script>
            function report(s) {
                if (window.nsh) window.nsh.postMessage(s);
            }

            window.onerror = function (m) {
                document.getElementById("loading").textContent = "Map error: " + m;
                report("error: " + m);
            };
        </script>
        <script type="module">
            const workerUrl = URL.createObjectURL(
                new Blob([document.getElementById("maplibre-worker-src").textContent], { type: "text/javascript" })
            );
            const maplibregl = await import(
                URL.createObjectURL(
                    new Blob([document.getElementById("maplibre-src").textContent], { type: "text/javascript" })
                )
            );
            maplibregl.setWorkerUrl(workerUrl);

            const ARCHIVE = "https://maps.passberg.net/germany.pmtiles";
            const ROUTE = [__ROUTE__];
            const interactive = __INTERACTIVE__;
            const theme = "__THEME__";

            const palette = getMapPalette(theme);
            document.body.style.background = palette.background;
            document.getElementById("loading").style.background = palette.background;

            const protocol = new pmtiles.Protocol();
            maplibregl.addProtocol("pmtiles", protocol.tile);

            const archive = new pmtiles.PMTiles(ARCHIVE);
            protocol.add(archive);

            const SOURCE_FILE = "germany.pmtiles";
            const sources = buildSources([SOURCE_FILE]);
            sources.germany.url = "pmtiles://" + ARCHIVE;

            archive.getTileJson("pmtiles://" + ARCHIVE).then(function () {
                const map = new maplibregl.Map({
                    container: "map",
                    style: {
                        version: 8,
                        sources: sources,
                        layers: buildLayers([SOURCE_FILE], theme),
                    },
                    interactive: true,
                    attributionControl: false,
                });

                const bounds = ROUTE.reduce(
                    function (b, c) { return b.extend(c); },
                    new maplibregl.LngLatBounds(ROUTE[0], ROUTE[0])
                );
                function fit() {
                    map.fitBounds(bounds, { padding: 24, animate: false });
                }
                fit();

                // Refit after the app resizes the web view.
                let pendingFit = false;
                window.addEventListener("message", function (e) {
                    if (e.data !== "fullscreen on" && e.data !== "fullscreen off") return;
                    pendingFit = true;
                });

                let shown = false;
                map.on("sourcedataloading", function (e) {
                    if (!e.tile || shown) return;
                    shown = true;
                    document.getElementById("loading").remove();
                    report("map ready");
                });

                map.on("idle", function () {
                    report("map idle");
                });

                map.on("load", function () {
                    report("map loaded " + innerWidth + "x" + innerHeight);
                    map.getSource("waypoint-path").setData({
                        type: "Feature",
                        properties: {},
                        geometry: { type: "LineString", coordinates: ROUTE },
                    });
                });

                new ResizeObserver(function () {
                    map.resize();
                    if (pendingFit) {
                        pendingFit = false;
                        fit();
                    }
                }).observe(document.getElementById("map"));

                document.addEventListener("visibilitychange", function () {
                    map.resize();
                });
            }).catch(function (e) {
                document.getElementById("loading").textContent = "Map failed to load: " + e;
                report("error: " + e);
            });
        </script>
    </body>
</html>
